<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UEO Quarterly Metrics</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-row">
        <img
          class="brand-logo"
          src="https://images.squarespace-cdn.com/content/v1/5622cd82e4b0501d40689558/745cbb64-4d28-4b69-9e21-efe08bf38ba8/unitedeffortorganization.png"
          alt="United Effort Organization"
        >
        <div>
          <p class="eyebrow">United Effort Organization</p>
          <h1>Quarterly Metrics</h1>
        </div>
      </div>
      <div class="period-controls" aria-label="Report period">
        <label>
          <span>Year</span>
          <input id="year-input" type="number" min="2020" max="2100" step="1" value="2026">
        </label>
        <label>
          <span>Start month</span>
          <select id="start-month-select">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </label>
        <label>
          <span>End month</span>
          <select id="end-month-select">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12" selected>December</option>
          </select>
        </label>
      </div>
    </header>

    <main class="app-shell">
      <section class="upload-section" aria-labelledby="upload-heading">
        <div class="section-heading">
          <h2 id="upload-heading">CSV Uploads</h2>
          <p id="loaded-summary">No files loaded yet.</p>
        </div>
        <div id="file-grid" class="file-grid"></div>
      </section>

      <section class="warnings-section" aria-live="polite">
        <ul id="warnings-list" class="warnings-list"></ul>
      </section>

      <section class="results-section" aria-labelledby="results-heading">
        <div class="section-heading results-heading-row">
          <div>
            <h2 id="results-heading">Metrics Table</h2>
            <p id="table-status">Upload CSV files to populate the metrics.</p>
          </div>
          <button id="copy-table" class="primary-button" type="button">Copy table</button>
        </div>
        <div class="table-wrap">
          <table id="metrics-table"></table>
        </div>
      </section>
    </main>

    <template id="file-card-template">
      <article class="file-card">
        <div class="file-card-header">
          <div>
            <h3></h3>
            <p class="example-name"></p>
          </div>
          <div class="tooltip-wrap">
            <button class="tooltip-button" type="button" aria-label="Column details">?</button>
            <div class="tooltip-panel" role="tooltip"></div>
          </div>
        </div>
        <input type="file" accept=".csv,text/csv">
        <p class="file-status">Waiting for upload.</p>
      </article>
    </template>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
